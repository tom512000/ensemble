name: Deploy Ensemble Production

on:
  push:
    branches:
      - prod

  workflow_dispatch:

concurrency:
  group: ensemble-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Test and deploy
    runs-on: ubuntu-latest

    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Quality checks
        run: npm run check

      - name: Format check
        run: npm run format:check

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npm run test:e2e

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy Ensemble
        run: |
          ssh \
            -o BatchMode=yes \
            -T \
            ubuntu@vps-93991c4a.vps.ovh.net

      - name: Verify production
        run: |
          for i in {1..10}; do
            if curl -fsS https://ensemble.tomsikora.dev/api/ready >/dev/null; then
              echo "Ensemble is online"
              exit 0
            fi

            sleep 3
          done

          echo "Production readiness check failed"
          exit 1
