name: ensemble
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ensemble
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ensemble_dev}
      POSTGRES_DB: ensemble
    ports:
      - '127.0.0.1:55432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ensemble -d ensemble']
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped
  migrate:
    build:
      context: .
      target: server
    environment:
      DATABASE_URL: postgresql://ensemble:${POSTGRES_PASSWORD:-ensemble_dev}@db:5432/ensemble
      NODE_ENV: production
    command: ['node', 'apps/server/dist/db/migrate.js']
    depends_on:
      db:
        condition: service_healthy
    restart: 'no'
  server:
    build:
      context: .
      target: server
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://ensemble:${POSTGRES_PASSWORD:-ensemble_dev}@db:5432/ensemble
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost:8085,http://127.0.0.1:8085}
      PORT: 3001
      TRUST_PROXY: 'false'
    ports:
      - '127.0.0.1:3005:3001'
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    init: true
    stop_grace_period: 15s
  web:
    build:
      context: .
      target: web
    ports:
      - '8085:8080'
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped
volumes:
  postgres_data:
